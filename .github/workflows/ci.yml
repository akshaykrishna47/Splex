name: CI

# Cloudflare Pages deploys from `main` regardless of what happens here, so this
# is a signal rather than a gate. Its job is that a broken push is visibly
# broken, instead of being discovered in the deployed app.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same source of truth as the Cloudflare build, so CI cannot pass on
          # a Node version production never sees.
          node-version-file: .nvmrc
          cache: npm

      # `ci`, not `install`: installs exactly the lockfile and fails if
      # package.json and package-lock.json have drifted apart.
      - run: npm ci

      - run: npm run typecheck

      # No env block. `.env.test` is committed and Vitest loads it in test
      # mode, which is what stops `lib/supabase.ts` throwing at import.
      - run: npm test
